name: 功能建议
description: 提出一个新功能或改进想法
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 你遇到什么问题
      description: 先说场景和痛点，再说方案
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 你希望怎么解决
      description: 描述期望的交互或行为
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的其他方案
      description: 有的话写一下，方便判断取舍
    validations:
      required: false

  - type: checkboxes
    id: scope
    attributes:
      label: 补充确认
      options:
        - label: 这个需求在现有功能里没有对应实现
          required: false
        - label: 我愿意自己提 PR 实现
          required: false
